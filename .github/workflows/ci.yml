# スイカゲーム（メタ層のアプリ）の CI。
# PR と既定ブランチ（develop）への push で lint / 型チェック / 単体テスト / E2E を回す。
#
# `template/` 配下（プロジェクトへコピーされるペイロード）は lint / テストの対象外なので、
# 本ワークフローはメタ層のアプリと hook 回帰テストだけを見る。
#
# action の major は Node 24 ランタイム（`runs.using: node24`）の版に揃えてある。
# 2026-06 以降、runner は node20 の action を node24 へ強制移行して annotation を出すため、
# node20 の major（checkout@v4 / setup-node@v4 / setup-python@v5 / upload-artifact@v4）は
# 使わない。上げるときは Node ランタイムも合わせて確認すること。
name: CI

on:
  pull_request:
  push:
    branches: [develop]

# 同一 ref に後続 push が来たら古い実行は捨てる（デプロイと違い途中結果に価値がない。
# E2E を含むぶん 1 実行が長いので効果が大きい）
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  app:
    name: lint / build / unit / e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # package.json の engines は >=22.12。.npmrc の engine-strict=true により
          # これを下回ると npm ci 自体が失敗する。
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      # `npm run build` は `tsc --noEmit`（型チェック）→ `vite build` の順で走る。
      # base はローカルと同じ既定値（`/`）のままでよい（公開用のビルドは pages.yml が行う）。
      # E2E も内部で build するが、型エラーは webServer のログに埋もれるより先に単独で落としたい。
      - name: Build
        run: npm run build

      - name: Unit test (Vitest)
        run: npm test

      # E2E は build 済みの dist/ を preview 経由で検証する（playwright.config.ts の webServer）。
      # 対象ブラウザは chromium のみ（mobile-portrait プロジェクトも chromium で動く）
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E test (Playwright)
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  hooks:
    name: push レビューゲートの回帰テスト
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          # review-runner.py は Python 3.8+ / 標準ライブラリのみ（CLAUDE.md のメタ層テスト規約）
          python-version: '3.11'

      # 本テストは git の挙動そのものを検証対象にしているため、失敗の切り分けに
      # runner 側のバージョンが要る（ローカルと CI で git の major が離れることがある）
      - name: Show tool versions
        run: |
          python3 --version
          git --version

      # `-v` はテスト名を 1 件ずつ出す。どの受け入れ条件が落ちたかを log だけで特定できる
      - name: Unit test (unittest)
        run: python3 -m unittest discover -s tests -v

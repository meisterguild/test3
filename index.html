<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>スイカゲーム</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main class="app">
      <h1 class="app__title">スイカゲーム</h1>
      <!--
        canvas の属性値は契約点 §5 の論理座標系 480×720（初期値）。
        起動後は src/game/renderer.ts が「CSS 表示サイズ × devicePixelRatio」の
        実解像度へ書き換える（R-04）。ここの値は初回描画までの暫定サイズとしてのみ効く。
        値の複製は tests/unit/constants.test.ts が constants.ts と突き合わせて検知する。
      -->
      <canvas
        class="app__canvas"
        data-testid="game-canvas"
        width="480"
        height="720"
        role="img"
        aria-label="ゲーム盤面"
      ></canvas>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
